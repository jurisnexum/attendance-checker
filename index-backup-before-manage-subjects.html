<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <title>JNX Attendance System</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

</head>

<body>

    <main class="home-dashboard">

        <header class="dashboard-header">

            <div>

                <div class="dashboard-brand">
                    JNX
                </div>

                <h1>
                    Attendance System
                </h1>

                <p>
                    Select a subject to record attendance.
                </p>

            </div>

        </header>


        <section class="dashboard-section">

            <div class="dashboard-section-heading">

                <div>

                    <h2>
                        My Subjects
                    </h2>

                    <p>
                        Choose the subject you want to manage.
                    </p>

                </div>

            </div>


            <div
                id="subjectGrid"
                class="subject-grid"
            ></div>

        </section>


        <section class="dashboard-tools">

            <a
                href="student-management.html"
                class="dashboard-tool"
            >

                <span class="tool-icon">
                    👥
                </span>

                <span>

                    <strong>
                        Student Management
                    </strong>

                    <small>
                        Add, update and manage students
                    </small>

                </span>

                <span class="tool-arrow">
                    →
                </span>

            </a>

        </section>

    </main>


    <script src="data/subjects.js"></script>

    <script>

        const subjectGrid =
            document.getElementById(
                "subjectGrid"
            );


        SUBJECTS.forEach(function(subject) {

            const link =
                document.createElement("a");

            link.className =
                "subject-card";

            link.href =
                "attendance.html?subject=" +
                encodeURIComponent(subject.id);


            link.innerHTML =

                '<div class="subject-icon">' +
                    subject.icon +
                '</div>' +

                '<div class="subject-content">' +

                    '<span class="subject-code">' +
                        subject.code +
                    '</span>' +

                    '<h3>' +
                        subject.name +
                    '</h3>' +

                    '<span class="subject-action">' +
                        'Open Attendance →' +
                    '</span>' +

                '</div>';

            subjectGrid.appendChild(link);

        });

    </script>


    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                function() {

                    navigator.serviceWorker
                        .register(
                            "service-worker.js"
                        )
                        .then(function() {

                            console.log(
                                "JNX OFFLINE MODE READY"
                            );

                        })
                        .catch(function(error) {

                            console.error(
                                "Offline mode error:",
                                error
                            );

                        });

                }
            );

        }

    </script>


<script>
(function() {

    if (!("serviceWorker" in navigator)) {
        return;
    }

    navigator.serviceWorker.register(
        "service-worker.js"
    ).then(function(registration) {

        registration.update();

        registration.addEventListener(
            "updatefound",
            function() {

                const newWorker =
                    registration.installing;

                if (!newWorker) {
                    return;
                }

                newWorker.addEventListener(
                    "statechange",
                    function() {

                        if (
                            newWorker.state ===
                            "installed" &&
                            navigator.serviceWorker.controller
                        ) {

                            window.location.reload();

                        }

                    }
                );

            }
        );

    }).catch(function(error) {

        console.error(
            "Service worker error:",
            error
        );

    });

})();
</script>

</body>

</html>
