<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Student Management | JNX Attendance
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="app">

        <header class="app-header">

            <div>

                <h1>
                    Student Management
                </h1>

                <p>
                    Add and manage classmates for attendance
                </p>

            </div>


            <nav class="dashboard-nav">

                <a
                    href="index.html"
                    class="dashboard-nav-button"
                >
                    <span>←</span>
                    <span>Home</span>
                </a>

            </nav>

        </header>


        <section class="attendance-card">

            <h2>
                Add Student
            </h2>


            <form id="studentForm">

                <label for="studentNumber">
                    Student Number
                </label>

                <input
                    type="text"
                    id="studentNumber"
                    placeholder="Enter student number"
                    autocomplete="off"
                    required
                >


                <label for="studentName">
                    Student Name
                </label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter student's full name"
                    autocomplete="off"
                    required
                >


                <label for="studentYear">
                    Year Level
                </label>

                <input
                    type="text"
                    id="studentYear"
                    placeholder="Example: 3"
                    autocomplete="off"
                    required
                >


                <label for="studentSection">
                    Section
                </label>

                <input
                    type="text"
                    id="studentSection"
                    placeholder="Example: A"
                    autocomplete="off"
                    required
                >


                <div>

                    <button
                        type="submit"
                        id="saveStudentButton"
                    >
                        Add Student
                    </button>

                    <button
                        type="button"
                        id="cancelStudentButton"
                        hidden
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </section>


        <section class="today-card">

            <h2>
                Classmates
            </h2>


            <input
                type="search"
                id="studentSearch"
                placeholder="Search student number or name..."
                autocomplete="off"
            >


            <div id="studentCount">
                0 students
            </div>


            <div id="studentList">

                <p>
                    No students added yet.
                </p>

            </div>

        </section>

    </main>


    <script src="student-management.js"></script>

</body>

</html>
