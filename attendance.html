<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Attendance Checker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <main class="app">

        <nav class="dashboard-navigation">

            <a
                href="index.html"
                class="dashboard-nav-button"
                title="Return to Home"
            >
                <span class="dashboard-nav-icon">⌂</span>
                <span>Home</span>
            </a>

            <a
                href="student-management.html"
                class="dashboard-nav-button"
                title="Student Management"
            >
                <span class="dashboard-nav-icon">👥</span>
                <span>Students</span>
            </a>

        </nav>

    <nav class="app-navigation">

        <a
            href="student-management.html"
            class="dashboard-link"
            title="Open Student Management"
        >
            <span class="dashboard-link-icon">⚙</span>
            <span>Student Management</span>
        </a>

    </nav>


        <header class="header">

            <div class="subject-badge" id="subjectBadge">
                <span class="subject-badge-label">
                    SUBJECT
                </span>

                <strong id="currentSubjectName">
                    Attendance
                </strong>
            </div>

            <h1>Attendance Checker</h1>
            <p>Offline Student Attendance System</p>
        </header>

        <section class="attendance-card">

            <h2>Record Attendance</h2>

            <label for="studentNumber">
                Student Number or Surname
            </label>

            <input
                id="studentNumber"
                type="text"
                placeholder="Enter student number or surname"
                autocomplete="off"
            >

            <button
                id="attendanceButton"
                type="button"
            >
                Mark Attendance
            </button>

            <div
                id="result"
                class="result"
            ></div>

            <div
                id="studentChoices"
                class="student-choices"
            ></div>

        </section>

        <section class="today-card">

            <div class="section-header">

                <h2>
                    Today's Attendance
                </h2>

                <span id="attendanceCount">
                    0
                </span>

            </div>

            <div id="attendanceList">

                <p class="empty">
                    No attendance recorded yet.
                </p>

            </div>

        </section>

    </main>

    <button
        id="clearAttendanceButton"
        type="button"
    >
        Clear Today Attendance
    </button>

    <script src="data/students.js"></script>
    <script src="data/attendance-db.js"></script>
    <script src="app.js"></script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function() {
                navigator.serviceWorker.register("service-worker.js")
                    .then(function() {
                        console.log("JNX OFFLINE MODE READY");
                    })
                    .catch(function(error) {
                        console.error("Offline mode error:", error);
                    });
            });
        }
    </script>

<script>
(function() {

    if (!("serviceWorker" in navigator)) {
        return;
    }

    navigator.serviceWorker.register(
        "service-worker.js"
    ).then(function(registration) {

        registration.update();

        registration.addEventListener(
            "updatefound",
            function() {

                const newWorker =
                    registration.installing;

                if (!newWorker) {
                    return;
                }

                newWorker.addEventListener(
                    "statechange",
                    function() {

                        if (
                            newWorker.state ===
                            "installed" &&
                            navigator.serviceWorker.controller
                        ) {

                            window.location.reload();

                        }

                    }
                );

            }
        );

    }).catch(function(error) {

        console.error(
            "Service worker error:",
            error
        );

    });

})();
</script>

</body>
</html>
