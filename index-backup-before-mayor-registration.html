<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <title>JNX Attendance System</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

</head>

<body>

    <main class="home-dashboard">

        <header class="dashboard-header">

            <div>

                <div class="dashboard-brand">
                    JNX
                </div>

                <h1>
                    Attendance System
                </h1>

                <p>
                    Select a subject to record attendance.
                </p>

            </div>

        </header>


        <section class="dashboard-section">

            <div class="dashboard-section-heading">

                <div>

                    <h2>
                        My Subjects
                    </h2>

                    <p>
                        Choose the subject you want to manage.
                    </p>

                </div>

            </div>


            <div
                id="subjectGrid"
                class="subject-grid"
            ></div>

        </section>


        <section class="dashboard-tools">

            <a
                href="subject-management.html"
                class="dashboard-tool"
            >

                <span class="tool-icon">
                    📚
                </span>

                <span>

                    <strong>
                        Subject Management
                    </strong>

                    <small>
                        Add, edit and remove subjects
                    </small>

                </span>

                <span class="tool-arrow">
                    →
                </span>

            </a>


            <a
                href="student-management.html"
                class="dashboard-tool"
            >

                <span class="tool-icon">
                    👥
                </span>

                <span>

                    <strong>
                        Student Management
                    </strong>

                    <small>
                        Add, update and manage students
                    </small>

                </span>

                <span class="tool-arrow">
                    →
                </span>

            </a>

        </section>

    </main>


    <script src="data/subjects.js"></script>


    <script>

        /*
         * HOME PAGE SUBJECT LOADER
         *
         * Uses the same local subject database
         * used by Subject Management.
         */

        const subjectGrid =
            document.getElementById("subjectGrid");


        function getHomeSubjects() {

            try {

                if (
                    typeof loadSubjects === "function"
                ) {

                    return loadSubjects();

                }

            } catch (error) {

                console.error(
                    "Could not load subjects:",
                    error
                );

            }


            try {

                const saved =
                    localStorage.getItem(
                        "jnx_subjects"
                    );

                if (saved) {

                    const subjects =
                        JSON.parse(saved);

                    if (
                        Array.isArray(subjects)
                    ) {

                        return subjects;

                    }

                }

            } catch (error) {

                console.error(
                    "Could not read saved subjects:",
                    error
                );

            }


            return [];

        }


        function escapeHomeHtml(value) {

            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        function renderHomeSubjects() {

            if (!subjectGrid) {
                return;
            }


            const subjects =
                getHomeSubjects();


            subjectGrid.innerHTML = "";


            if (!subjects.length) {

                subjectGrid.innerHTML =
                    '<div class="empty-subject-message">' +
                        '<div style="font-size:42px;">📚</div>' +
                        '<strong>No subjects yet</strong>' +
                        '<span>' +
                            'Open Subject Management to add your first subject.' +
                        '</span>' +
                    '</div>';

                return;

            }


            subjects.forEach(function(subject) {

                const link =
                    document.createElement("a");


                link.className =
                    "subject-card";


                link.href =
                    "attendance.html?subject=" +
                    encodeURIComponent(
                        subject.id
                    );


                link.innerHTML =

                    '<div class="subject-icon">' +
                        escapeHomeHtml(
                            subject.icon || "📚"
                        ) +
                    '</div>' +

                    '<div class="subject-content">' +

                        '<span class="subject-code">' +
                            escapeHomeHtml(
                                subject.code || ""
                            ) +
                        '</span>' +

                        '<h3>' +
                            escapeHomeHtml(
                                subject.name || "Unnamed Subject"
                            ) +
                        '</h3>' +

                        '<span class="subject-action">' +
                            'Open Attendance →' +
                        '</span>' +

                    '</div>';


                subjectGrid.appendChild(link);

            });

        }


        renderHomeSubjects();


        window.addEventListener(
            "storage",
            function(event) {

                if (
                    event.key === "jnx_subjects"
                ) {

                    renderHomeSubjects();

                }

            }
        );

    </script>

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                function() {

                    navigator.serviceWorker
                        .register(
                            "service-worker.js"
                        )
                        .then(function() {

                            console.log(
                                "JNX OFFLINE MODE READY"
                            );

                        })
                        .catch(function(error) {

                            console.error(
                                "Offline mode error:",
                                error
                            );

                        });

                }
            );

        }

    </script>


<script>
(function() {

    if (!("serviceWorker" in navigator)) {
        return;
    }

    navigator.serviceWorker.register(
        "service-worker.js"
    ).then(function(registration) {

        registration.update();

        registration.addEventListener(
            "updatefound",
            function() {

                const newWorker =
                    registration.installing;

                if (!newWorker) {
                    return;
                }

                newWorker.addEventListener(
                    "statechange",
                    function() {

                        if (
                            newWorker.state ===
                            "installed" &&
                            navigator.serviceWorker.controller
                        ) {

                            window.location.reload();

                        }

                    }
                );

            }
        );

    }).catch(function(error) {

        console.error(
            "Service worker error:",
            error
        );

    });

})();
</script>

</body>

</html>
